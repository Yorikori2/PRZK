/* ===== viewport ===== */
let dpr=1,vw=0,vh=0;
function size(){dpr=Math.min(3,window.devicePixelRatio||1);vw=wrap.clientWidth;vh=wrap.clientHeight;view.width=Math.round(vw*dpr);view.height=Math.round(vh*dpr)}
const zoom=()=>zoomMode==0?Math.min(vw/SW,vh/SH):zoomMode;
function clamp(){const z=zoom(),w=vw/z,h=vh/z;cx=w>=SW?(SW-w)/2:Math.max(0,Math.min(SW-w,cx));cy=h>=SH?(SH-h)/2:Math.max(0,Math.min(SH-h,cy))}
function present(){const z=zoom();clamp();vctx.setTransform(1,0,0,1,0,0);vctx.fillStyle='#000';vctx.fillRect(0,0,view.width,view.height);vctx.imageSmoothingEnabled=false;
 vctx.setTransform(z*dpr,0,0,z*dpr,-cx*z*dpr,-cy*z*dpr);vctx.drawImage(scn,0,0);vctx.setTransform(1,0,0,1,0,0);
 if(labels){vctx.font='600 '+Math.round(12*dpr)+'px system-ui';vctx.textAlign='center';vctx.textBaseline='middle';
  for(const[n,x,y]of ROOMS){const sx=(x-cx)*z*dpr,sy=(y-cy)*z*dpr;if(sx<-60*dpr||sy<-20*dpr||sx>view.width+60*dpr||sy>view.height+20*dpr)continue;const w=vctx.measureText(n).width+12*dpr;
   vctx.fillStyle='rgba(12,16,20,.72)';vctx.beginPath();vctx.roundRect(sx-w/2,sy-10*dpr,w,20*dpr,6*dpr);vctx.fill();vctx.fillStyle='#f2f4f5';vctx.fillText(n,sx,sy+dpr)}}}
function loop(now){requestAnimationFrame(loop);if(play)tp=(now-t0)/1000;scene(tp);present()}
let drag=null;view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx,cy};view.setPointerCapture(e.pointerId);view.style.cursor='grabbing'});
view.addEventListener('pointermove',e=>{if(!drag)return;const z=zoom();cx=drag.cx-(e.clientX-drag.x)/z;cy=drag.cy-(e.clientY-drag.y)/z});
const end=()=>{drag=null;view.style.cursor='grab'};view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
const setZ=(m,id)=>{const z0=zoom(),mx=cx+vw/z0/2,my=cy+vh/z0/2;zoomMode=m;const z=zoom();cx=mx-vw/z/2;cy=my-vh/z/2;['zf','z1','z2'].forEach(b=>document.getElementById(b).classList.toggle('on',b==id))};
document.getElementById('zf').onclick=()=>setZ(0,'zf');document.getElementById('z1').onclick=()=>setZ(1,'z1');document.getElementById('z2').onclick=()=>setZ(2,'z2');
document.getElementById('lb').onclick=e=>{labels=!labels;e.target.classList.toggle('on',labels)};
document.getElementById('lt').onclick=e=>{night=!night;e.target.textContent=night?'☀ 낮':'🌙 밤'};
document.getElementById('an').onclick=e=>{play=!play;if(play)t0=performance.now()-tp*1000;e.target.textContent=play?'⏸ 정지':'▶ 재생'};
addEventListener('resize',size);size();requestAnimationFrame(loop);
