<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pixel Style Samples</title>
<style>
:root{--bg:#0d1013;--fg:#e9edf0;--mut:#8f99a2;--line:#ffffff1c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px 10px 40px}h1{font-size:18px;margin:4px 0 2px}p.lead{margin:0 0 12px;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:#151b20;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in}
.card canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#000}
.card .t{padding:10px 12px 12px}.card h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}.card h3 .n{font-size:12px;color:#ffd36a;border:1px solid #8a6a2a;border-radius:99px;padding:0 8px}
.card .d{font-size:12.5px;color:var(--mut);margin-top:3px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tags span{font-size:11px;padding:1px 7px;border-radius:99px;background:#ffffff10;color:#c9d2d8}
.card.ref{border-color:#4a7aa0}.card.new{border-color:#e0574f;box-shadow:0 0 0 1px #e0574f55}
#zoom{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:12px;z-index:9;flex-direction:column;gap:8px}#zoom canvas{max-width:100%;max-height:85vh;image-rendering:pixelated}#zoom div{color:#fff;font-size:14px}
</style></head><body><main>
<h1>도트 그래픽 스타일 샘플 11종</h1><p class="lead">같은 장면(진료소 로비)을 10가지 스타일로 표현했습니다. 카드를 누르면 크게 볼 수 있습니다. 마음에 드는 번호를 알려주세요.</p>
<div class="grid" id="g"></div></main><div id="zoom"></div>
<script src="art.js"></script><script src="world.js"></script>
<script>
buildWorld();
const SW=448,SH=336,[ox,oy]=bo(1,0),X0=ox+392-SW/2,Y0=oy+410-SH/2;
function base(o={}){const c=document.createElement('canvas');c.width=SW;c.height=SH;const x=c.getContext('2d');g=x;x.translate(-X0,-Y0);drawStatic(X0,Y0,SW,SH);
 if(o.ref){// snow / dust drifts along wall bases + heavy gore on floors
  const drift=(x0,x1,y,dir)=>{for(let xx=x0;xx<x1;xx+=2){const h=hh(xx,y,4),t=1+Math.round(h*3+Math.sin(xx*.3)*1.2);if(h<.12)continue;R('#eef2f4',xx,dir>0?y+1:y-t,2,t);if(h>.8)R('#ffffff',xx,dir>0?y+1:y-t,1,1)}};
  for(const h of W0.hw)if(h.x1>X0&&h.x0<X0+SW&&h.y>Y0&&h.y<Y0+SH+20){drift(h.x0,h.x1,h.y,1)}
  for(const v of W0.vw)if(v.x>X0-8&&v.x<X0+SW+8){for(let yy=v.y0;yy<v.y1;yy+=2){const q=hh(v.x,yy,5);if(q<.5)continue;const t=1+Math.round(q*2);R('#eef2f4',v.x+3,yy,t,2);R('#eef2f4',v.x-3-t,yy,t,2)}}
  const spray=(cx,cy,n,rad,seed)=>{for(let i=0;i<n;i++){const a=hh(i,seed,1)*6.28,r2=Math.pow(hh(i,seed,2),1.6)*rad,s=hh(i,seed,3)<.25?2:1;R(hh(i,seed,4)<.5?'#c41414':'#8a0a0a',cx+Math.cos(a)*r2,cy+Math.sin(a)*r2*.7,s,s)}blob(cx,cy,3,2,'#a80f0f')};
  [[300,478,90,40,1],[330,470,60,26,2],[250,402,70,30,3],[365,295,50,24,4],[280,505,80,34,5],[440,478,30,14,6],[520,335,50,30,7],[150,520,40,20,8],[600,400,40,22,9]].forEach(([a,b2,n,r2,sd])=>spray(ox+a,oy+b2,n,r2,sd));
  for(let i=0;i<40;i++)R(i%3?'#8a0a0a':'#c41414',ox+238+i*1.6+Math.sin(i/4)*3,oy+500+Math.cos(i/5)*2,2,1)}
 
 const inR=(a,b,w,h)=>a<X0+SW&&a+w>X0&&b<Y0+SH&&b+h>Y0,L=[];
 for(const h of W0.hw)if(inR(h.x0,h.y-50,h.x1-h.x0,60))L.push({y:h.y,f:()=>hwallD(h.x0,h.x1,h.y,h.h,h.face)});
 for(const o of W0.objs)if(inR(o.x-20,o.y-100,o.w+40,o.h+110))L.push({y:o.y+o.h,f:()=>D[o.t](o)});
 const P=(lk,dx,dy,dir,w,s=1,fr=1)=>L.push({y:oy+dy,f:()=>drawChar(lk,ox+dx,oy+dy,dir,fr,w,s)});
 P('player',440,500,'l','rifle',1,-1);P('runner',300,470,'r');P('nurse',360,290,'d');P('doctor',250,400,'r');P('heavy',520,330,'d',null,1.35);P('patient',300,540,'r');
 if(o.ref)for(const h of W0.hw)if(h.h>=20&&h.x1>X0&&h.x0<X0+SW&&h.y>Y0&&h.y<Y0+SH+40)L.push({y:h.y+.01,f:()=>{for(let xx=Math.max(h.x0,X0);xx<Math.min(h.x1,X0+SW);xx+=7){const q=hh(xx,h.y,9);if(q<.86)continue;const ln2=3+(q*10|0);R('#9a0c0c',xx,h.y-h.h,2,Math.min(h.h,ln2));R('#c41414',xx,h.y-h.h,1,Math.min(h.h,ln2-2))}}});
 L.sort((a,b)=>a.y-b.y).forEach(o=>o.f());poolD(ox+330,oy+478,7);corpseD(ox+280,oy+505,'civ1');for(let i=0;i<120;i+=2)R('#fff3a0',ox+424-i,oy+483-i*.11,1,1);blob(ox+422,oy+483,4,3,'#ffd36a');
 if(o.ref){x.globalCompositeOperation='lighter';const gr=x.createRadialGradient(ox+420,oy+483,0,ox+420,oy+483,20);gr.addColorStop(0,'rgba(255,200,110,.7)');gr.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=gr;x.fillRect(ox+400,oy+463,40,40);x.globalCompositeOperation='source-over';for(let i=0;i<8;i++)R('#ffd36a',ox+404-hh(i,7,1)*20,oy+476+hh(i,7,2)*14,1,1)}
 x.setTransform(1,0,0,1,0,0);return c}
const SRCIMG=base();
/* ---------- helpers ---------- */
const cl=v=>v<0?0:v>255?255:v,hx=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
function clone(){const c=document.createElement('canvas');c.width=SW;c.height=SH;c.getContext('2d').drawImage(SRCIMG,0,0);return c}
function px(c,f){const x=c.getContext('2d'),im=x.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){const r=f(d[i],d[i+1],d[i+2],(i/4)%c.width,((i/4)/c.width)|0);d[i]=r[0];d[i+1]=r[1];d[i+2]=r[2]}x.putImageData(im,0,0);return c}
function quant(c,pal){const P=pal.map(hx),cache=new Map();return px(c,(r,g2,b)=>{const k=(r<<16)|(g2<<8)|b;let v=cache.get(k);if(!v){let bd=1e9;for(const p of P){const dd=(r-p[0])**2*.3+(g2-p[1])**2*.59+(b-p[2])**2*.11;if(dd<bd){bd=dd;v=p}}cache.set(k,v)}return v})}
function down(c,k){const s=document.createElement('canvas');s.width=c.width/k;s.height=c.height/k;const sx=s.getContext('2d');sx.imageSmoothingEnabled=false;sx.drawImage(c,0,0,s.width,s.height);const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const ox2=o.getContext('2d');ox2.imageSmoothingEnabled=false;ox2.drawImage(s,0,0,o.width,o.height);return o}
function blur(c,k){const s=document.createElement('canvas');s.width=c.width/k;s.height=c.height/k;const sx=s.getContext('2d');sx.imageSmoothingEnabled=true;sx.drawImage(c,0,0,s.width,s.height);const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.imageSmoothingEnabled=true;x.drawImage(s,0,0,o.width,o.height);return o}
const lum=(r,g2,b)=>.3*r+.59*g2+.11*b;
function edges(c,th=60){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height).data,W=c.width,H=c.height,e=new Uint8Array(W*H);for(let y=1;y<H-1;y++)for(let i=1;i<W-1;i++){const k=(y*W+i)*4,l=lum(d[k],d[k+1],d[k+2]),l2=lum(d[k+4],d[k+5],d[k+6]),l3=lum(d[k+W*4],d[k+W*4+1],d[k+W*4+2]);if(Math.abs(l-l2)+Math.abs(l-l3)>th)e[y*W+i]=1}return e}
function vignette(c,a=.5,col='0,0,0'){const x=c.getContext('2d'),gr=x.createRadialGradient(SW/2,SH/2,SH*.3,SW/2,SH/2,SH*.85);gr.addColorStop(0,'rgba('+col+',0)');gr.addColorStop(1,'rgba('+col+','+a+')');x.fillStyle=gr;x.fillRect(0,0,SW,SH);return c}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
/* ---------- styles ---------- */
const NES=['#7c7c7c','#0000fc','#0000bc','#4428bc','#940084','#a80020','#a81000','#881400','#503000','#007800','#006800','#005800','#004058','#000000','#bcbcbc','#0078f8','#0058f8','#6844fc','#d800cc','#e40058','#f83800','#e45c10','#ac7c00','#00b800','#00a800','#00a844','#008888','#f8f8f8','#3cbcfc','#6888fc','#9878f8','#f878f8','#f85898','#f87858','#fca044','#f8b800','#b8f818','#58d854','#58f898','#00e8d8','#787878','#fcfcfc','#a4e4fc','#b8b8f8','#d8b8f8','#f8b8f8','#f8a4c0','#f0d0b0','#fce0a8','#f8d878','#d8f878','#b8f8b8','#b8f8d8','#00fcfc','#f8d8f8'];
const RETRO32=['#0b0b14','#1e1e2e','#34344a','#55556e','#8888a0','#c4c4d4','#f0f0f4','#4a1a1a','#8a2a2a','#c84040','#e88060','#f4c090','#3a2a1a','#6a4a2a','#a07040','#d0a060','#1a3a2a','#2a6a3a','#4aa050','#90d060','#1a2a4a','#2a4a8a','#4a80c8','#90c0f0','#4a3a5a','#7a5a8a','#c090c0','#a0a040','#e0d060','#5a6a6a','#8aa0a0','#d0e0d8'];
const PASTEL=['#fbf5ef','#f2d3ab','#c69fa5','#8b6d9c','#494d7e','#272744','#f5e6c8','#e8c1a0','#cfe5c8','#9fcfb0','#a8d0e6','#7aa8d0','#f4b6c2','#e8879c','#fff1a8','#d8c8f0'];
function refGrade(c){return px(c,(r,g2,b)=>{const bl=r>70&&g2<45&&b<45;if(bl)return[cl(r*1.18+16),cl(g2*.5),cl(b*.5)];const l=lum(r,g2,b),k=.6;let R2=r*k+l*(1-k),G=g2*k+l*(1-k),B=b*k+l*(1-k);R2=R2*.94+6;G=G*.96+8;B=B*.98+10;const ct=v=>cl((v-128)*.95+124);return[ct(R2),ct(G),ct(B)]})}
const STYLES=[
 ['🆕 참고 이미지 스타일','무채색에 가까운 차분한 회색·녹회색 톤 + 아주 선명한 붉은 피 + 벽 아래 하얗게 쌓인 눈·먼지 + 밝게 번지는 총구 섬광.',['참고 이미지','무채색','선명한 피','눈 쌓인 벽'],()=>{const c=base({ref:1});return refGrade(c)},0,1],
 ['현재 스타일 (기준)','지금 게임에 쓰고 있는 32px 고해상도 도트. 비교 기준입니다.',['기준','32px','자연 색감'],c=>c,1],
 ['레트로 16비트','해상도를 절반으로 낮춰 16px 타일처럼 굵직하게, 32색 팔레트로 정리.',['SFC 감성','굵은 픽셀','32색'],c=>quant(down(c,2),RETRO32)],
 ['패미컴 8비트','8비트 콘솔 팔레트(54색)와 4배 큰 픽셀. 가장 고전적인 느낌.',['8비트','54색','큰 픽셀'],c=>quant(down(c,3),NES)],
 ['휴대용 게임기 4색','초록빛 4단계 명암만 사용하는 흑백 휴대용 게임기 스타일.',['4색','레트로 휴대기','미니멀'],c=>{const p=['#0f380f','#306230','#8bac0f','#9bbc0f'].map(hx);return px(down(c,2),(r,g2,b,x,y)=>{const l=lum(r,g2,b)/255+(BAYER[(y%4)*4+x%4]-.5)*.25;return p[Math.max(0,Math.min(3,Math.floor(l*4)))]})}],
 ['서바이벌 호러','채도를 낮추고 녹갈색으로 물들인 어둡고 더러운 분위기 + 필름 노이즈.',['공포','탁한 색','필름 그레인'],c=>{px(c,(r,g2,b)=>{const l=lum(r,g2,b),k=.32;let R2=r*k+l*(1-k),G=g2*k+l*(1-k),B=b*k+l*(1-k);if(r>g2*1.5&&r>b*1.5&&r>80){R2=r*.9;G=g2*.5;B=b*.5}return[cl(R2*.82+8),cl(G*.88+10),cl(B*.7)]});px(c,(r,g2,b)=>{const n=(Math.random()-.5)*26;return[cl(r+n),cl(g2+n),cl(b+n)]});return vignette(c,.7)}],
 ['누아르 흑백','흑백 3단계 명암에 피만 붉게 남긴 강렬한 대비.',['흑백','빨강 포인트','고대비'],c=>px(c,(r,g2,b,x,y)=>{if(r>g2*1.6&&r>b*1.6&&r>70)return[200,30,30];const l=lum(r,g2,b)/255+(BAYER[(y%4)*4+x%4]-.5)*.2;return l>.66?[236,236,230]:l>.36?[120,120,124]:[18,18,22]})],
 ['파스텔 코지','밝고 부드러운 16색 파스텔. 무서움보다는 귀엽고 아기자기한 느낌.',['귀여움','파스텔','16색'],c=>{px(c,(r,g2,b)=>[cl(r*.7+80),cl(g2*.7+76),cl(b*.7+84)]);return quant(c,PASTEL)}],
 ['사이버펑크 네온','어두운 남색 화면에 윤곽선만 분홍·하늘색 네온으로 빛나는 밤거리 느낌.',['네온','밤','발광 효과'],c=>{const e=edges(c,55),W=SW;px(c,(r,g2,b)=>{const l=lum(r,g2,b);return[cl(l*.18+8),cl(l*.12+6),cl(l*.35+24)]});const x=c.getContext('2d'),im=x.getImageData(0,0,SW,SH),d=im.data,src=SRCIMG.getContext('2d').getImageData(0,0,SW,SH).data;for(let i=0;i<e.length;i++)if(e[i]){const k=i*4,warm=src[k]>src[k+2];d[k]=warm?255:40;d[k+1]=warm?60:230;d[k+2]=warm?200:255}x.putImageData(im,0,0);const gl=blur(c,4),gx=c.getContext('2d');gx.globalCompositeOperation='lighter';gx.globalAlpha=.7;gx.drawImage(gl,0,0);gx.globalAlpha=1;gx.globalCompositeOperation='source-over';return c}],
 ['코믹북 (두꺼운 외곽선)','색을 단순한 단계로 나누고 굵은 검정 외곽선을 둘러 만화처럼.',['만화','굵은 외곽선','단순한 색'],c=>{const e=edges(c,70),W=SW;px(c,(r,g2,b)=>[Math.round(r/64)*64,Math.round(g2/64)*64,Math.round(b/64)*64].map(v=>cl(v*1.05)));const x=c.getContext('2d'),im=x.getImageData(0,0,SW,SH),d=im.data;for(let i=0;i<e.length;i++)if(e[i]||e[i-1]||e[i-W]){const k=i*4;d[k]=d[k+1]=d[k+2]=12}x.putImageData(im,0,0);return c}],
 ['1비트 디더링','검정과 종이색 두 가지만 쓰고 점 패턴(디더링)으로 명암을 표현. 고전 PC 게임 느낌.',['2색','디더링','고전 PC'],c=>px(c,(r,g2,b,x,y)=>lum(r,g2,b)/255>BAYER[(y%4)*4+x%4]?[232,226,210]:[24,22,30])],
 ['세피아 CRT','오래된 브라운관 TV처럼 갈색 톤 + 주사선 + 화면 휨 느낌.',['빈티지','주사선','브라운관'],c=>{px(c,(r,g2,b,x,y)=>{const R2=r*.393+g2*.769+b*.189,G=r*.349+g2*.686+b*.168,B=r*.272+g2*.534+b*.131,s=y%3==2?.62:1;return[cl(R2*s*.9),cl(G*s*.88),cl(B*s*.8)]});return vignette(c,.65)}],
 ['포스트 아포칼립스 노을','주황빛 하이라이트와 청록색 그림자로 영화처럼 색 보정. 먼지 낀 노을.',['영화 색감','노을','청록·주황'],c=>{px(c,(r,g2,b)=>{const l=lum(r,g2,b)/255,t=l;return[cl(r*.75+t*70+(1-t)*5),cl(g2*.75+t*30+(1-t)*30),cl(b*.7+(1-t)*45)]});const x=c.getContext('2d'),gr=x.createLinearGradient(0,0,0,SH);gr.addColorStop(0,'rgba(255,140,60,.22)');gr.addColorStop(1,'rgba(20,60,70,.18)');x.fillStyle=gr;x.fillRect(0,0,SW,SH);return vignette(c,.45,'20,10,0')}],
];
const G=document.getElementById('g'),Z=document.getElementById('zoom');
let num=0;STYLES.forEach(([n,d,tags,f,ref,isNew],i)=>{const c=f(clone()),card=document.createElement('div');card.className='card'+(ref?' ref':'')+(isNew?' new':'');if(!ref&&!isNew)num++;const no=isNew?'NEW':num;card.appendChild(c);
 card.insertAdjacentHTML('beforeend','<div class="t"><h3>'+(ref?'':'<span class="n">'+no+'</span>')+n+'</h3><div class="d">'+d+'</div><div class="tags">'+tags.map(t=>'<span>'+t+'</span>').join('')+'</div></div>');
 card.onclick=()=>{Z.innerHTML='';const b=document.createElement('canvas');b.width=SW;b.height=SH;b.getContext('2d').drawImage(c,0,0);b.style.width=Math.min(innerWidth-24,SW*2.4)+'px';Z.appendChild(b);Z.insertAdjacentHTML('beforeend','<div>'+(ref?'':no+'. ')+n+' — 화면을 누르면 닫힙니다</div>');Z.style.display='flex'};G.appendChild(card)});
Z.onclick=()=>Z.style.display='none';
</script></body></html>
