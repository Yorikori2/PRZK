<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Expansion Samples</title>
<style>
:root{--bg:#0e1113;--fg:#e8ecef;--mut:#9aa3aa;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px 8px 28px}
h1{font-size:18px;margin:4px 0 2px}p{margin:0 0 8px;color:var(--mut);font-size:13px}
#wrap{position:relative;width:100%;height:64vh;min-height:340px;border-radius:8px;overflow:hidden;background:#000;touch-action:none}
#v{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.row{display:flex;gap:6px;margin:8px 0 0;flex-wrap:wrap}button{font:inherit;color:var(--fg);background:#1d2328;border:1px solid #fff2;border-radius:8px;padding:6px 10px}button.on{background:#2d4a63}
#desc{margin-top:8px;font-size:13px;color:var(--mut)}
</style></head><body><main>
<h1>확장 샘플 · 새 군부대와 새 건물</h1><p>아직 게임에 넣지 않은 미리보기입니다. 확인해 주시면 게임에 적용합니다. 탭으로 건물을 바꾸고 드래그해서 둘러보세요.</p>
<div class="row" id="tabs"></div>
<div id="wrap" style="margin-top:8px"><canvas id="v"></canvas></div>
<div class="row"><button id="zf">전체</button><button id="z1" class="on">1배</button><button id="z2">2배</button><button id="lb" class="on">방 이름</button><button id="rf">지붕 보기</button><button id="lt">🌙 밤</button></div>
<div class="row" id="lvrow" style="display:none"><span style="align-self:center;color:var(--mut)">거점 레벨</span><button data-lv="1" class="on">Lv1</button><button data-lv="2">Lv2</button><button data-lv="3">Lv3</button></div>
<div id="desc"></div>
</main>
<script src="art.js"></script><script src="world.js"></script><script src="world_next.js"></script>
<script>
buildNextWorld();
const TABS=[['mil','군부대 (확장)',0,0,'블록 2개 크기(이전의 약 2.2배). 지휘본부(작전실·무전실·지휘관실), 막사 2동, 식당, 의무대, 콘크리트 무기고 벙커(폭발물), 차량정비고(트럭·험비), 헬기 잔해, 유류고, 사격장, 감시탑 7개, 기관총 진지와 검문소. 군인 좀비 19 + 중무장 좀비 3.',2],
 ['fire','소방서',2,0,'소방차 2대가 선 차고, 방화복 걸이, 숙직실, 주방·휴게실, 사무실. 첫 수색 시 소방 도끼 획득 예정. 소방관 좀비 4.',1],
 ['ware','물류창고',0,1,'팔레트 랙 6줄, 지게차, 하역장 도크 4개, 트레일러와 컨테이너, 2층 사무실. 목재·고철·연료가 많이 나오는 곳.',1],
 ['lab','연구소',1,1,'감염의 근원이 연상되는 위험 지역. 배양 탱크(일부 파손), 흄후드 실험실, 서버실, 소장실, 격리실, 제염실, 약품 보관실. 방호복 좀비 다수.',1],
 ['apt','아파트',2,1,'원룸 5세대, 복도, 계단과 우편함, 주차장, 놀이터.',1],
 ['church','교회',3,0,'스테인드글라스 예배당(신도석 16줄·제단·오르간), 목양실, 창고와 주방, 종탑, 묘지.',1]];
let tab=0,zoomMode=1,labels=true,roofs=false,baseLv=1,cx=0,cy=0;
const view=document.getElementById('v'),vctx=view.getContext('2d'),wrap=document.getElementById('wrap');
const scn=document.createElement('canvas'),sx=scn.getContext('2d'),stat=document.createElement('canvas');
const PAD=64;let RX=0,RY=0,RW=BW+PAD*2,RH=BH+PAD*2;
function lvMap(n){return{core:n,wall:n,bench:n,med:n,farm:n,water:n,gen:n,turret:n,tower:n}}
function buildStat(){const[c,r]=[TABS[tab][2],TABS[tab][3]],[ox,oy]=bo(c,r),nb=TABS[tab][5];RX=ox-PAD;RY=oy-PAD;RW=nb*BW+(nb-1)*RD+PAD*2;RH=BH+PAD*2;scn.width=stat.width=RW;scn.height=stat.height=RH;const x=stat.getContext('2d');x.setTransform(1,0,0,1,-RX,-RY);g=x;drawStatic(RX,RY,RW,RH);x.setTransform(1,0,0,1,0,0)}
function render(){g=sx;sx.setTransform(1,0,0,1,-RX,-RY);sx.drawImage(stat,RX,RY);
 const inR=(x,y,w,h)=>x<RX+RW&&x+w>RX&&y<RY+RH&&y+h>RY,L=[];
 for(const h of W0.hw)if(inR(h.x0,h.y-50,h.x1-h.x0,60))L.push({y:h.y,f:()=>hwallD(h.x0,h.x1,h.y,h.h,h.face)});
 const objs=W0.objs;
 for(const o of objs)if(!FLAT[o.t]&&inR(o.x-20,o.y-100,o.w+40,o.h+110))L.push({y:o.y+o.h,f:()=>D[o.t](o)});
 const t=performance.now()/1000;W0.zs.forEach((z,i)=>{if(!inR(z.x-20,z.y-40,40,44))return;const ph=(t*.8+i)%4,dir=['d','r','d','l'][(ph|0)],fr=((t*4)|0)%4;L.push({y:z.y,f:()=>drawChar(z.look,z.x+Math.sin(t*.7+i)*6,z.y,dir,fr,null,z.look=='heavy'?1.35:1)})});
 
 if(roofs)for(const r of W0.roofs)if(inR(r.x,r.y-50,r.w,r.h+60))L.push({y:r.y+r.h,f:()=>roofD(r,1)});
 L.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 if(NIGHT){sx.fillStyle='rgba(8,14,40,.64)';sx.fillRect(RX,RY,RW,RH);sx.globalCompositeOperation='lighter';for(const[x,y,r,a,c]of W0.lights){if(!inR(x-r,y-r,r*2,r*2))continue;const gr=sx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+c+','+a+')');gr.addColorStop(1,'rgba('+c+',0)');sx.fillStyle=gr;sx.fillRect(x-r,y-r,r*2,r*2)}sx.globalCompositeOperation='source-over'}
 sx.setTransform(1,0,0,1,0,0)}
let dpr=1,vw=0,vh=0;
function size(){dpr=Math.min(3,devicePixelRatio||1);vw=wrap.clientWidth;vh=wrap.clientHeight;view.width=Math.round(vw*dpr);view.height=Math.round(vh*dpr)}
const zoom=()=>zoomMode==0?Math.min(vw/RW,vh/RH):zoomMode;
function clamp(){const z=zoom(),w=vw/z,h=vh/z;cx=w>=RW?(RW-w)/2:Math.max(0,Math.min(RW-w,cx));cy=h>=RH?(RH-h)/2:Math.max(0,Math.min(RH-h,cy))}
function present(){const z=zoom();clamp();vctx.setTransform(1,0,0,1,0,0);vctx.fillStyle='#000';vctx.fillRect(0,0,view.width,view.height);vctx.imageSmoothingEnabled=false;vctx.setTransform(z*dpr,0,0,z*dpr,-cx*z*dpr,-cy*z*dpr);vctx.drawImage(scn,0,0);vctx.setTransform(1,0,0,1,0,0);
 if(labels){vctx.font='600 '+Math.round(12*dpr)+'px system-ui';vctx.textAlign='center';vctx.textBaseline='middle';const names=roofs?W0.roofs.filter(r=>r.label).map(r=>[r.label,r.x+r.w/2,r.y+r.h/2-20]):W0.rooms;
  for(const[n,x,y]of names){const px=(x-RX-cx)*z*dpr,py=(y-RY-cy)*z*dpr;if(px<-80*dpr||py<-20*dpr||px>view.width+80*dpr||py>view.height+20*dpr)continue;const w=vctx.measureText(n).width+12*dpr;vctx.fillStyle='rgba(12,16,20,.72)';vctx.beginPath();vctx.roundRect(px-w/2,py-10*dpr,w,20*dpr,6*dpr);vctx.fill();vctx.fillStyle='#f2f4f5';vctx.fillText(n,px,py+dpr)}}}
function loop(){requestAnimationFrame(loop);NIGHT=night;render();present()}
let night=false;
function setTab(i){tab=i;buildStat();document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on',j==i));document.getElementById('desc').textContent=TABS[i][4];cx=PAD+200;cy=PAD+60}
const tabs=document.getElementById('tabs');TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[1];b.onclick=()=>setTab(i);tabs.appendChild(b)});
let drag=null;view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx,cy};view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(!drag)return;const z=zoom();cx=drag.cx-(e.clientX-drag.x)/z;cy=drag.cy-(e.clientY-drag.y)/z});
const end=()=>drag=null;view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
const setZ=(m,id)=>{const z0=zoom(),mx=cx+vw/z0/2,my=cy+vh/z0/2;zoomMode=m;const z=zoom();cx=mx-vw/z/2;cy=my-vh/z/2;['zf','z1','z2'].forEach(b=>document.getElementById(b).classList.toggle('on',b==id))};
document.getElementById('zf').onclick=()=>setZ(0,'zf');document.getElementById('z1').onclick=()=>setZ(1,'z1');document.getElementById('z2').onclick=()=>setZ(2,'z2');
document.getElementById('lb').onclick=e=>{labels=!labels;e.target.classList.toggle('on',labels)};
document.getElementById('rf').onclick=e=>{roofs=!roofs;e.target.classList.toggle('on',roofs)};
document.getElementById('lt').onclick=e=>{night=!night;e.target.textContent=night?'☀ 낮':'🌙 밤'};
document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{baseLv=+b.dataset.lv;document.querySelectorAll('[data-lv]').forEach(x=>x.classList.toggle('on',x==b))});
addEventListener('resize',size);size();setTab(0);requestAnimationFrame(loop);
</script></body></html>
