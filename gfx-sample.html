<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pixel Art Directions</title>
<style>
:root{--bg:#0d1013;--fg:#e9edf0;--mut:#8f99a2;--line:#ffffff1c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:12px 10px 40px}h1{font-size:18px;margin:4px 0 2px}p.lead{margin:0 0 12px;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:#151b20;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#000}
.card .t{padding:10px 12px 12px}.card h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}.card h3 .n{font-size:12px;color:#ffd36a;border:1px solid #8a6a2a;border-radius:99px;padding:0 8px;flex:none}
.card .d{font-size:12.5px;color:var(--mut);margin-top:3px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tags span{font-size:11px;padding:1px 7px;border-radius:99px;background:#ffffff10;color:#c9d2d8}
</style></head><body><main>
<h1>게임 도트 그래픽 스타일 20종 (새로 그린 장면)</h1><p class="lead">같은 장소(집 거실·주방, 길, 자동차, 나무, 플레이어, 좀비 3마리)를 스타일마다 처음부터 다시 그렸습니다. 타일 크기, 시점, 색, 외곽선, 캐릭터 비율이 모두 다릅니다.</p>
<div class="grid" id="g"></div></main>
<script>
let g;const P=(c,x,y,w,h)=>{if(!c)return;g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const h2r=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],r2h=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mul=(h,f)=>r2h(h2r(h).map(v=>v*f)),mix=(a,b,t)=>{const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v+(B[i]-v)*t))};
const hh=(a,b,k=0)=>{let h=Math.imul(a+k*131,374761393)+Math.imul(b,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
function blob(cx,cy,rx,ry,c){g.fillStyle=c;for(let d=-ry;d<=ry;d++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-d*d/(ry*ry))));g.fillRect(Math.round(cx-w),Math.round(cy+d),w*2,1)}}
/* ================= shared map (20 x 12 cells) ================= */
const MC=20,MR=12,MAP=[];
for(let y=0;y<MR;y++){MAP.push([]);for(let x=0;x<MC;x++){let t='G';if(x==16||x==17)t='R';else if(x==15||x==18)t='S';if(x>=1&&x<=13&&y>=2&&y<=10){const edge=x==1||x==13||y==2||y==10;t=edge?'W':x<7?'F':x==7?'W':'K'}MAP[y].push(t)}}
MAP[6][7]='DF';MAP[10][4]='D';
const WIN={'2,3':1,'2,5':1,'2,10':1,'2,12':1};
const OBJ=[{t:'shelf',x:2,y:3,w:1,h:1},{t:'tv',x:4,y:3,w:1,h:1},{t:'plant',x:6,y:3,w:1,h:1},{t:'ctable',x:4,y:6,w:1,h:1},{t:'sofa',x:3,y:8,w:2,h:1},{t:'counter',x:8,y:3,w:3,h:1},{t:'fridge',x:12,y:3,w:1,h:1},{t:'ktable',x:9,y:5,w:2,h:1},{t:'trash',x:12,y:9,w:1,h:1},{t:'car',x:16,y:6,w:1,h:2},{t:'lamp',x:15,y:2,w:1,h:1}];
const RUG={x:3,y:5,w:3,h:2},TREES=[[2,0],[8,0],[12,0],[19,1],[14,11],[19,10]];
const CHR=[{k:'player',x:5.6,y:7.5,d:'r'},{k:'zombie',x:10.4,y:7.6,d:'l'},{k:'zombie',x:15.5,y:4.6,d:'l'},{k:'zombie2',x:18.4,y:9.4,d:'l'}];
const BLOOD=[[9.4,8.7,6],[10.7,8.0,3],[15.2,5.0,3],[6.2,9.1,2]],CORPSE=[9.2,8.7];
const isW=(x,y)=>MAP[y]&&MAP[y][x]=='W';
/* ================= generic pixel character ================= */
const CP={player:{skin:'#e8b88c',hair:'#3a2618',top:'#4f7a4a',bot:'#3a4a6a',eye:'#1a1a1a',hat:'#2f4a2a'},zombie:{skin:'#94ab7e',hair:'#3a3a2a',top:'#8a4a4a',bot:'#3a3a44',eye:'#ff2020'},zombie2:{skin:'#9aa48a',hair:'#2a2a22',top:'#4a5a8a',bot:'#2a2a30',eye:'#ff2020'}};
function pchar(kind,px,py,dir,o){const c={...CP[kind],...(o.pal&&o.pal[kind]||{})},h=o.h,s=o.shape||'std',zb=kind!='player',R=[];const add=(col,x,y,w,hgt)=>R.push([col,x,y,w,hgt]);
 const hd=Math.round(h*(s=='chibi'?.46:s=='tiny'?.36:.34)),bd=Math.round(h*(s=='chibi'?.28:.34)),lg=h-hd-bd,w=Math.max(4,Math.round(h*(s=='chibi'?.62:.42))),x0=Math.round(px-w/2),f=dir=='r'?1:-1;
 const yH=py-h,yB=yH+hd,yL=yB+bd;
 add(c.bot,x0+1,yL,Math.max(1,Math.floor(w/2)-1),lg);add(c.bot,x0+Math.ceil(w/2),yL,Math.max(1,Math.floor(w/2)-1),lg-1);
 add(c.top,x0,yB,w,bd);
 if(zb){const ay=yB+1;add(c.skin,f>0?x0+w:x0-Math.round(w*.6),ay,Math.round(w*.6),Math.max(1,Math.round(h*.07)))}else{add(c.skin,f>0?x0+w-1:x0-1,yB+1,Math.max(1,Math.round(w*.25)),Math.round(bd*.8));add('#222428',f>0?x0+w:x0-Math.round(w*.9),yB+Math.round(bd*.35),Math.round(w*.9),Math.max(1,Math.round(h*.07)))}
 add(c.skin,x0+(s=='chibi'?-1:0),yH,w+(s=='chibi'?2:0),hd);
 const hairH=Math.max(1,Math.round(hd*.3));add(zb?c.hair:(c.hat||c.hair),x0+(s=='chibi'?-1:0),yH,w+(s=='chibi'?2:0),hairH);if(!zb&&c.hat)add(c.hat,f>0?x0+w:x0-2,yH+hairH-1,2,1);
 const ey=yH+Math.round(hd*.55),es=Math.max(1,Math.round(hd*.18));add(c.eye,f>0?x0+w-es-1:x0+1,ey,es,es);if(w>=6)add(c.eye,f>0?x0+w-es*3-1:x0+es*2+1,ey,es,es);
 if(zb)add('#8f1010',x0+1,yB+1,Math.max(1,Math.round(w*.3)),Math.max(1,Math.round(bd*.3)));
 if(o.shade)R.forEach(r=>{});
 if(o.ol){R.forEach(([col,x,y,ww,hh2])=>P(o.ol,x-1,y-1,ww+2,hh2+2))}
 R.forEach(([col,x,y,ww,hh2])=>{P(col,x,y,ww,hh2);if(o.shade&&ww>2){P(mul(col,1.18),x,y,1,hh2);P(mul(col,.75),x+ww-1,y,1,hh2)}});
 if(o.shadow)P('#00000040',x0,py,w,1)}
/* ================= generic 3/4 tile renderer ================= */
function r34(S){const T=S.T,c=document.createElement('canvas');c.width=MC*T;c.height=MR*T;g=c.getContext('2d');const p=S.pal,ol=S.ol;
 const BOX=(x,y,w,h,H,top,face)=>{if(ol)P(ol,x-1,y-H-1,w+2,h+H+2);P(top,x,y-H,w,h);P(face,x,y+h-H,w,H);if(S.bevel){P(mul(top,1.15),x,y-H,w,1);P(mul(face,.85),x,y+h-1,w,1)}};
 // floors
 for(let y=0;y<MR;y++)for(let x=0;x<MC;x++){const t=MAP[y][x][0],X=x*T,Y=y*T;S.floor(t=='D'?(MAP[y][x]=='DF'?'F':'K'):t,X,Y,T,x,y)}
 // rug
 if(S.rug)S.rug(RUG.x*T,RUG.y*T,RUG.w*T,RUG.h*T);
 // blood + corpse
 BLOOD.forEach(([bx,by,r])=>S.blood(bx*T,by*T,r*T/8));
 S.corpse&&S.corpse(CORPSE[0]*T,CORPSE[1]*T);
 // rows
 for(let y=0;y<MR;y++){for(let x=0;x<MC;x++){if(isW(x,y)){const X=x*T,Y=y*T,H=S.wallH,below=isW(x,y+1);S.wall(X,Y,T,H,!below,WIN[y+','+x],y==10)}}
  for(const o of OBJ)if(o.y+o.h-1==y)S.obj(o,o.x*T,o.y*T,o.w*T,o.h*T,BOX);
  for(const[tx,ty]of TREES)if(ty==y)S.tree(tx*T+T/2,ty*T+T);
  for(const ch of CHR)if(Math.floor(ch.y)==y)S.char(ch.k,ch.x*T,ch.y*T,ch.d)}
 S.fx&&S.fx(T);S.post&&S.post(c,T);return c}
/* shared object painter for 3/4 styles */
function objStd(S,o,X,Y,W2,H2,BOX){const T=S.T,p=S.pal,k=T/16,d=S.detail||0,t=o.t;
 if(t=='shelf'){BOX(X+k,Y,W2-2*k,H2,T*.9,p.wood2||mul(p.wood,.8),mul(p.wood,.7));if(d)for(let i=0;i<4;i++)P(['#c94f3a','#3a7bc9','#e0b03a','#4fa05a'][i],X+2*k+i*3*k,Y+H2-T*.75,2*k,4*k)}
 if(t=='tv'){BOX(X+k,Y+4*k,W2-2*k,H2-6*k,4*k,mul(p.wood,.7),mul(p.wood,.5));P('#1a1a1e',X+2*k,Y-6*k,W2-4*k,9*k);P('#3a5a8a',X+3*k,Y-5*k,W2-6*k,6*k)}
 if(t=='plant'){P('#8a4a2a',X+5*k,Y+8*k,6*k,6*k);blob(X+8*k,Y+4*k,5*k,5*k,p.leaf||'#3f8a3a');if(d)blob(X+7*k,Y+3*k,2*k,2*k,mul(p.leaf||'#3f8a3a',1.3))}
 if(t=='ctable'){BOX(X+2*k,Y+4*k,W2-4*k,H2-6*k,4*k,p.wood,mul(p.wood,.7))}
 if(t=='sofa'){BOX(X,Y+2*k,W2,H2-2*k,7*k,p.sofa||'#5a6e9a',mul(p.sofa||'#5a6e9a',.7));P(mul(p.sofa||'#5a6e9a',.8),X+k,Y-4*k,W2-2*k,3*k)}
 if(t=='counter'){BOX(X,Y+k,W2,H2-k,8*k,p.ctop||'#c8c0b0',p.cface||'#8a6a4a');if(d){P('#2a2a2a',X+3*k,Y-6*k,4*k,3*k);P('#2a2a2a',X+9*k,Y-6*k,4*k,3*k);P('#8aa0b0',X+W2-12*k,Y-6*k,8*k,4*k)}}
 if(t=='fridge'){BOX(X+2*k,Y,W2-4*k,H2,T*1.1,'#eef2f4','#c8d0d8');P('#8a9096',X+W2-5*k,Y+H2-T*.8,k,4*k)}
 if(t=='ktable'){BOX(X+2*k,Y+3*k,W2-4*k,H2-5*k,5*k,p.wood,mul(p.wood,.7));if(d){P('#f4f4ee',X+5*k,Y,3*k,2*k);P('#f4f4ee',X+W2-8*k,Y+k,3*k,2*k)}}
 if(t=='trash'){BOX(X+4*k,Y+5*k,W2-8*k,H2-6*k,6*k,'#5a6a5a','#3a4a3a')}
 if(t=='car'){BOX(X+k,Y+2*k,W2-2*k,H2-4*k,6*k,p.car||'#c43c32',mul(p.car||'#c43c32',.7));P('#8fb6cf',X+3*k,Y+4*k,W2-6*k,5*k);P('#141414',X-k,Y+5*k,2*k,4*k);P('#141414',X+W2-k,Y+5*k,2*k,4*k);P('#141414',X-k,Y+H2-10*k,2*k,4*k);P('#141414',X+W2-k,Y+H2-10*k,2*k,4*k)}
 if(t=='lamp'){P('#3a3f45',X+7*k,Y-14*k,2*k,T+14*k-2*k);P('#3a3f45',X+7*k,Y-14*k,6*k,2*k);P('#f0e8b0',X+11*k,Y-12*k,3*k,k)}}
function wallStd(S,X,Y,T,H,face,win,outer){const p=S.pal,ol=S.ol;if(ol)P(ol,X-(S.olw||0),Y-H-1,T+(S.olw||0)*2,T+(face?0:0)+1);P(p.wtop,X,Y-H,T,T);if(S.bevel)P(mul(p.wtop,1.1),X,Y-H,T,1);
 if(face){P(outer?p.wout||p.wface:p.wface,X,Y+T-H,T,H);if(S.brick){for(let yy=Y+T-H;yy<Y+T;yy+=Math.max(2,T/8)){P(mul(outer?p.wout||p.wface:p.wface,.82),X,yy,T,1);for(let xx=X+(((yy/(T/8))|0)%2?0:T/4);xx<X+T;xx+=T/2)P(mul(outer?p.wout||p.wface:p.wface,.82),xx,yy,1,Math.max(2,T/8))}}
  if(win){P(ol||'#2a2a2a',X+T*.2-1,Y+T-H+T*.15-1,T*.6+2,H*.5+2);P(p.glass,X+T*.2,Y+T-H+T*.15,T*.6,H*.5);P(mul(p.glass,1.25),X+T*.25,Y+T-H+T*.18,T*.12,H*.35)}
  if(ol)P(ol,X,Y+T,T,1)}}
/* ================= styles ================= */
const PAL16={grass:'#4fa04a',grass2:'#5fb85a',tuft:'#3a8a36',road:'#5a5a66',lane:'#e8d070',side:'#b8b0a0',side2:'#a8a090',wood:'#c88a52',wood2:'#9a6438',tile:'#ece8e0',tile2:'#cfd6dc',wtop:'#efe2c6',wface:'#c8744c',wout:'#b86a44',glass:'#7ab8e8',leaf:'#3a9a3a',sofa:'#5a7ac0',car:'#d0403a'};
function floorStd(S){const p=S.pal;return(t,X,Y,T,x,y)=>{const k=T/16;
 if(t=='G'){P(p.grass,X,Y,T,T);if(S.detail){for(let i=0;i<3;i++){const a=hh(x,y,i)*T*.8,b=hh(y,x,i+3)*T*.8;P(p.tuft,X+a,Y+b,k,2*k);P(p.tuft,X+a+k,Y+b-k,k,2*k)}if(hh(x,y,9)<.15)P('#f4e070',X+T/2,Y+T/2,k,k)}else if((x+y)%2)P(p.grass2,X,Y,T,T)}
 if(t=='R'){P(p.road,X,Y,T,T);if(x==16)for(let yy=0;yy<T;yy+=T/2)P(p.lane,X+T-k,Y+yy,k,T/4)}
 if(t=='S'){P(p.side,X,Y,T,T);P(p.side2,X,Y+T-k,T,k);P(p.side2,X+T-k,Y,k,T)}
 if(t=='F'){P(p.wood,X,Y,T,T);for(let i=0;i<T;i+=T/4){P(p.wood2,X,Y+i+T/4-k,T,k);P(p.wood2,X+((x*7+i)%T),Y+i,k,T/4)}}
 if(t=='K'){P((x+y)%2?p.tile:p.tile2,X,Y,T,T)}
 if(t=='W')P(p.wtop,X,Y,T,T)}}
const STYLES=[
 ['클래식 16비트 RPG','16px 타일, 밝고 선명한 색, 검정 외곽선, 2.5등신 캐릭터. 고전 탑다운 RPG 느낌.',['16px 타일','선명한 색','고전 RPG'],()=>{const S={T:16,pal:PAL16,ol:'#201820',olw:0,wallH:12,brick:1,detail:1,bevel:1};S.floor=floorStd(S);S.rug=(x,y,w,h)=>{P('#a83a3a',x+2,y+2,w-4,h-4);P('#d8a050',x+4,y+4,w-8,h-8);P('#a83a3a',x+6,y+6,w-12,h-12)};S.blood=(x,y,r)=>blob(x,y,r*2,r*1.2,'#b01818');S.corpse=(x,y)=>{P('#201820',x-7,y-3,14,6);P('#8a4a4a',x-6,y-2,8,4);P('#94ab7e',x+2,y-2,4,4)};
  S.wall=(...a)=>wallStd(S,...a);S.obj=(o,X,Y,W2,H2,B)=>objStd(S,o,X,Y,W2,H2,B);S.tree=(x,y)=>{P('#5a3a20',x-1,y-6,3,6);blob(x,y-11,7,6,'#201820');blob(x,y-11,6,5,'#2f8a3a');blob(x-2,y-13,3,2,'#5fb85a')};S.char=(k,x,y,d)=>pchar(k,x,y,d,{h:22,shape:'chibi',ol:'#201820',shade:1,shadow:1});
  S.fx=(T)=>{P('#ffe080',6.3*T,7.15*T,3,2);for(let i=0;i<50;i+=2)P('#fff3a0',6.5*T+i,7.18*T,1,1)};return r34(S)}],
 ['아이소메트릭 픽셀','마름모 타일로 비스듬히 내려다보는 시점. 공간감과 깊이가 강함.',['아이소메트릭','입체 공간','전략 게임'],isoScene],
 ['단면 횡스크롤','건물을 옆에서 자른 단면도. 2층 집 내부와 거리가 한눈에. 플랫포머·생존 시뮬 느낌.',['옆 시점','2층 단면','시뮬레이션'],sideScene],
 ['미니멀 플랫','외곽선과 질감 없이 파스텔 단색과 부드러운 그림자만. 깔끔한 모던 인디 느낌.',['파스텔','외곽선 없음','깔끔함'],()=>{const pal={grass:'#b8dca8',grass2:'#b8dca8',tuft:'#a8cc98',road:'#a8acb8',lane:'#f4f0e0',side:'#e4e0d6',side2:'#e4e0d6',wood:'#ecd2b0',wood2:'#ecd2b0',tile:'#f2f4f6',tile2:'#e6eaee',wtop:'#ffffff',wface:'#d8cce4',wout:'#cfc0dc',glass:'#b8dcf0',leaf:'#7ac08a',sofa:'#9ab4e0',car:'#f0908a',ctop:'#f4f0ea',cface:'#d8c4b0'};
  const S={T:16,pal,ol:null,wallH:10,detail:0};S.floor=floorStd(S);S.rug=(x,y,w,h)=>{P('#f4c8c8',x+3,y+3,w-6,h-6)};S.blood=(x,y,r)=>blob(x,y,r*1.6,r,'#e07080');S.corpse=(x,y)=>{P('#e0b0b0',x-6,y-2,12,4)};S.wall=(X,Y,T,H,face,win,outer)=>{P('#00000012',X+2,Y+2,T,T);wallStd(S,X,Y,T,H,face,win,outer)};
  S.obj=(o,X,Y,W2,H2,B)=>{P('#00000014',X+2,Y+3,W2,H2);objStd(S,o,X,Y,W2,H2,B)};S.tree=(x,y)=>{P('#00000014',x-6,y-2,14,4);P('#b08a6a',x-1,y-6,2,6);blob(x,y-11,7,6,'#7ac08a')};
