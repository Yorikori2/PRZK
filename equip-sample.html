<h1>장비 착용 미리보기 · 단계별 장비</h1>
<p>장비를 고르면 플레이어 모습이 바로 바뀌어요. 머리·몸 장비는 5단계, 가방은 8단계예요. 4방향으로 걸을 때와 공격할 때 모두 보이고, 오른쪽은 실제 게임 크기 화면이에요. <small style="color:#e0b03a">제안</small> 표시는 아직 게임에 없는 새 장비 아이디어예요.</p>

</main>
