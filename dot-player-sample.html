<title>도트 레오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: single column — animated hero sprite, frame sheet, before/after, in-game view. Dark single theme to match the game. */
:root{--bg:#101315;--panel:#181d21;--line:#ffffff1a;--fg:#e9ecee;--mut:#9ba5ac;--acc:#e0b03a;--blue:#6fb3e0;
 --f-body:'Noto Sans KR',system-ui,sans-serif;--f-head:'Black Han Sans','Noto Sans KR',sans-serif;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
main{max-width:900px;margin:0 auto;padding-block:16px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h1{font-family:var(--f-head);font-weight:400;font-size:26px;margin:0;letter-spacing:.5px}
.lead{margin:0;color:var(--mut);max-width:66ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
.panel h2{font-size:15px;margin:0}.panel p{margin:0;color:var(--mut);font-size:13px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:8px}
.grp{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;color:var(--fg);background:#22292e;border:1px solid #ffffff24;border-radius:8px;padding:5px 11px;cursor:pointer}
button:hover{border-color:#ffffff55}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button.on{background:#4a3c14;border-color:var(--acc)}
.cap{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.two figure{margin:0;display:grid;gap:4px}.two figcaption{font-size:12px;color:var(--mut);text-align:center}
.pal{display:flex;flex-wrap:wrap;gap:4px}.pal i{width:18px;height:18px;border-radius:3px;display:block;border:1px solid #0006}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<main>
 <h1>도트 레오</h1>
 <p class="lead">플레이어 캐릭터 레오를 픽셀 한 칸씩 직접 찍어서 다시 그렸어요. 24×40 픽셀 크기에 33가지 색을 썼고, 앞·옆·뒤 걷기 4프레임과 총 겨누는 모습까지 있어요. 왼쪽 모습은 오른쪽을 뒤집어서 써요.</p>
 <section class="panel" aria-label="애니메이션 미리보기">
  <div class="grp" id="poses"></div>
  <canvas id="hero" width="384" height="132"></canvas>
  <div class="cap"><span>앞</span><span>오른쪽</span><span>뒤</span><span>왼쪽</span></div>
 </section>
 <section class="panel" aria-label="도트 시트">
  <h2>도트 시트</h2>
  <p>실제 게임에 들어갈 프레임 전체예요. 윗줄부터 앞, 옆, 뒤 걷기 4프레임이고 오른쪽 끝은 총 겨눔이에요.</p>
  <canvas id="sheet"></canvas>
  <div class="pal" id="pal" aria-label="사용한 색"></div>
 </section>
 <section class="panel" aria-label="비교">
  <h2>지금 게임 캐릭터와 비교</h2>
  <div class="two"><figure><canvas id="old" width="120" height="64"></canvas><figcaption>지금 게임 플레이어</figcaption></figure><figure><canvas id="new" width="120" height="64"></canvas><figcaption>새로 찍은 레오</figcaption></figure></div>
 </section>
 <section class="panel" aria-label="게임 화면">
  <h2>게임 화면에 넣었을 때</h2>
  <p>진료소 로비, 실제 게임 크기예요. 배경과 좀비는 지금 게임 그대로예요.</p>
  <canvas id="game" width="900" height="570"></canvas>
 </section>
</main>
<script src="art.js"></script><script src="world.js"></script>
