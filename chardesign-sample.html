<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Character Design Samples</title>
<style>
:root{--bg:#0d1013;--fg:#e9edf0;--mut:#8f99a2;--line:#ffffff1c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:1140px;margin:0 auto;padding:12px 10px 40px}h1{font-size:18px;margin:4px 0 2px}h2{font-size:16px;margin:22px 0 4px}p.lead{margin:0 0 10px;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:#151b20;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card canvas{display:block;width:100%;height:auto}
.card .t{padding:10px 12px 12px}.card h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}.card h3 .n{font-size:12px;color:#ffd36a;border:1px solid #8a6a2a;border-radius:99px;padding:0 8px;flex:none}
.card .d{font-size:12.5px;color:var(--mut);margin-top:3px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tags span{font-size:11px;padding:1px 7px;border-radius:99px;background:#ffffff10;color:#c9d2d8}
.legend{font-size:12.5px;color:var(--mut);margin-bottom:8px}
</style></head><body><main>
<h1>캐릭터 · 좀비 디자인 스타일 샘플</h1><p class="lead">같은 세 캐릭터를 여러 스타일로 그렸습니다: <b>생존자(플레이어) · 일반 좀비 · 브루트(거대 좀비)</b>. 마음에 드는 번호를 알려주세요. 섞는 것도 가능합니다 (예: P3 비율 + V2 색감).</p>
<h2>A. 도트 캐릭터 스타일 8종</h2><div class="legend">P1은 지금 게임의 캐릭터입니다.</div><div class="grid" id="gp"></div>
<h2>B. 도트가 아닌 그래픽 15종</h2><div class="legend">벡터 · 일러스트 · 3D풍 등. 게임을 이 방식으로 바꾸면 건물·가구 그림도 같은 스타일로 다시 그리게 됩니다.</div><div class="grid" id="gv"></div>
</main>
<script src="art.js"></script>
<script>
const CW=360,CH=220,BASEY=196;
/* ---------- color utils ---------- */
const h2r=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],r2h=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mul=(h,f)=>r2h(h2r(h).map(v=>v*f)),mix=(h,h2,t)=>{const a=h2r(h),b=h2r(h2);return r2h(a.map((v,i)=>v+(b[i]-v)*t))},lumH=h=>{const[r,g2,b]=h2r(h);return(.3*r+.59*g2+.11*b)/255};
const sat=(h,f)=>{const a=h2r(h),l=(a[0]+a[1]+a[2])/3;return r2h(a.map(v=>l+(v-l)*f))};
let SEED=1;const rnd=()=>{SEED=(SEED*16807)%2147483647;return SEED/2147483647};
/* ---------- paths ---------- */
function capsule(x1,y1,x2,y2,w){const a=Math.atan2(y2-y1,x2-x1),r=w/2,p=new Path2D();p.arc(x1,y1,r,a+Math.PI/2,a-Math.PI/2);p.arc(x2,y2,r,a-Math.PI/2,a+Math.PI/2);p.closePath();return p}
function rrect(x,y,w,h,r){const p=new Path2D();r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath();return p}
function ell(x,y,rx,ry){const p=new Path2D();p.ellipse(x,y,rx,ry,0,0,6.283);return p}
function polyP(pts){const p=new Path2D();pts.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath();return p}
/* ---------- characters ---------- */
const CHARS={
 player:{skin:'#e0b48c',hair:'#3b2a1e',shirt:'#5a6b45',pants:'#3d4f6b',shoe:'#2a2420',cap:'#2f3a2a',pack:'#7a5432',gun:'#2a2d30',eye:'#1a1a1a'},
 zombie:{skin:'#9aab86',hair:'#4a4a3a',shirt:'#8a5a5a',pants:'#3a3a40',shoe:'#2a2420',eye:'#e02020',blood:'#9a1010'},
 brute:{skin:'#8a7a6a',hair:'#3a2a22',shirt:null,pants:'#4a3a2a',shoe:'#2a2420',eye:'#ff3030',blood:'#9a1010'}};
const PROP={def:{hr:13,th:34,tw:22,ll:40,lw:9,al:30,hunch:0},chibi:{hr:22,th:22,tw:24,ll:18,lw:10,al:18,hunch:0},gothic:{hr:12,th:42,tw:15,ll:56,lw:6,al:42,hunch:0},minimal:{hr:14,th:32,tw:24,ll:36,lw:12,al:28,hunch:0},tiny:{hr:15,th:26,tw:24,ll:26,lw:11,al:22,hunch:0}};
/* figure: side view facing right at (x,BASEY) */
function figure(S,ctx,x,kind,face){const P={...PROP[S.prop||'def']},C={...CHARS[kind]},big=kind=='brute',zb=kind!='player';if(S.pal)for(const k in C)if(C[k])C[k]=S.pal(C[k],k,kind);
 const s=big?1.4:1;ctx.save();ctx.translate(x,BASEY);if(face<0)ctx.scale(-1,1);ctx.scale(s,s);
 const tw=P.tw*(big?1.5:1),lw=P.lw*(big?1.6:1),ll=P.ll*(big?.85:1),hip=-ll,neck=hip-P.th,st=ll*.28;
 const L=(x1,y1,x2,y2,w,c,back)=>S.shade(ctx,capsule(x1,y1,x2,y2,w),back?mul(c,S.back??.78):c,{x:Math.min(x1,x2)-w,y:Math.min(y1,y2)-w,w:Math.abs(x2-x1)+2*w,h:Math.abs(y2-y1)+2*w});
 // legs
 L(-1,hip,-st,-3,lw,C.pants,1);L(1,hip,st,-3,lw,C.pants);
 S.shade(ctx,rrect(-st-lw/2-2,-5,lw+6,5,2),C.shoe,{x:-st-8,y:-6,w:14,h:6});S.shade(ctx,rrect(st-lw/2,-5,lw+6,5,2),C.shoe,{x:st-6,y:-6,w:14,h:6});
 // upper body (zombie leans forward)
 ctx.save();ctx.translate(0,hip);ctx.rotate(zb?(big?.28:.18):0);ctx.translate(0,-hip);
 const sh=neck+5,arm=P.al*(big?1.2:1);
 if(kind=='player'){S.shade(ctx,rrect(-tw/2-9,neck+3,10,P.th*.7,3),C.pack,{x:-tw/2-9,y:neck,w:10,h:P.th});L(0,sh,arm*.55,sh+arm*.55,lw*.9,C.shirt,1);L(arm*.55,sh+arm*.55,arm*.95,sh+arm*.3,lw*.8,C.skin,1)}
 else{L(0,sh+2,arm,sh+4,lw*.9,C.skin,1)}
 // torso
 const tb={x:-tw/2,y:neck,w:tw,h:P.th+2};S.shade(ctx,rrect(tb.x,tb.y,tb.w,tb.h,S.round??4),C.shirt||C.skin,tb);
 if(zb&&C.shirt){S.shade(ctx,polyP([[-tw/2,neck+P.th-2],[-tw/4,neck+P.th+5],[0,neck+P.th-1],[tw/4,neck+P.th+6],[tw/2,neck+P.th-2],[tw/2,neck+P.th+2],[-tw/2,neck+P.th+2]]),C.shirt,tb)}
 if(S.stripes&&C.shirt){ctx.save();ctx.clip(rrect(tb.x,tb.y,tb.w,tb.h,S.round??4));ctx.fillStyle='#00000040';for(let y=tb.y+3;y<tb.y+tb.h;y+=6)ctx.fillRect(tb.x,y,tb.w,3);ctx.restore()}
 if(big){S.detail(ctx,'#00000030',[[-tw/4,neck+8,tw/2,2],[-tw/4,neck+16,tw/2,2]])}
 if(zb){S.detail(ctx,C.blood,[[tw*.05,neck+P.th*.35,5,6],[-tw*.3,neck+P.th*.65,4,3]])}
 // head
 const hx=zb?P.hr*.35:P.hr*.12,hy=neck-P.hr*.85;S.shade(ctx,ell(hx,hy,P.hr*(big?.85:1),P.hr*(big?.8:1)),C.skin,{x:hx-P.hr,y:hy-P.hr,w:P.hr*2,h:P.hr*2});
 if(kind=='player'){S.shade(ctx,polyP([[hx-P.hr*1.02,hy-P.hr*.15],[hx-P.hr*.9,hy-P.hr*.85],[hx+P.hr*.2,hy-P.hr*1.05],[hx+P.hr*1.05,hy-P.hr*.55],[hx+P.hr*1.45,hy-P.hr*.45],[hx+P.hr*1.0,hy-P.hr*.3],[hx-P.hr*.5,hy-P.hr*.3]]),C.cap,{x:hx-P.hr,y:hy-P.hr*1.1,w:P.hr*2.5,h:P.hr})}
 else{S.shade(ctx,polyP([[hx-P.hr,hy-P.hr*.1],[hx-P.hr*.7,hy-P.hr*.9],[hx+P.hr*.4,hy-P.hr*1.02],[hx+P.hr*.2,hy-P.hr*.7],[hx-P.hr*.4,hy-P.hr*.55]]),C.hair,{x:hx-P.hr,y:hy-P.hr,w:P.hr*2,h:P.hr})}
 S.eye(ctx,hx+P.hr*.45,hy-P.hr*.05,Math.max(1.6,P.hr*(S.prop=='chibi'?.2:.13)),C.eye,zb);
 if(zb)S.detail(ctx,'#3a0a0a',[[hx+P.hr*.25,hy+P.hr*.42,P.hr*.55,P.hr*.16]]);if(zb)S.detail(ctx,C.blood,[[hx+P.hr*.45,hy+P.hr*.55,2,P.hr*.5]]);
 // front arm + gun / zombie front arm
 if(kind=='player'){const gx=arm*.45,gy=sh+arm*.28;S.shade(ctx,rrect(gx-8,gy-3,42+(S.prop=='chibi'?-8:0),6,1.5),C.gun,{x:gx-8,y:gy-3,w:42,h:6});S.shade(ctx,rrect(gx-14,gy-1,10,7,2),mix(C.gun,'#7a5432',.6),{x:gx-14,y:gy,w:10,h:7});S.shade(ctx,rrect(gx+6,gy+2,5,9,1.5),C.gun,{x:gx+6,y:gy+2,w:5,h:9});
  L(0,sh,arm*.4,sh+arm*.5,lw*.95,C.shirt);L(arm*.4,sh+arm*.5,arm*.62,sh+arm*.3,lw*.85,C.skin)}
 else{L(0,sh,arm*.98,sh-2,lw,C.shirt||C.skin);S.shade(ctx,ell(arm*.98+2,sh-2,lw*.55,lw*.5),C.skin,{x:arm,y:sh-6,w:lw,h:lw})}
 ctx.restore();ctx.restore()}
/* ---------- shaders (non-pixel styles) ---------- */
const dflt={eye:(c,x,y,r,col,zb)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,6.3);c.fill()},detail:(c,col,rs)=>{c.fillStyle=col;rs.forEach(([x,y,w,h])=>{c.fillRect(x,y,w,h)})}};
function clipDo(c,p,f){c.save();c.clip(p);f();c.restore()}
const V=[
 ['플랫 벡터','외곽선 없이 단색 면으로만. 깔끔하고 현대적인 모바일 게임 느낌.',['깔끔','단색','모바일'],{shade:(c,p,col)=>{c.fillStyle=col;c.fill(p)},bg:(c)=>{c.fillStyle='#dfe7e2';c.fillRect(0,0,CW,CH);c.fillStyle='#b8c8bc';c.fillRect(0,BASEY,CW,CH)}}],
 ['카툰','굵은 검정 외곽선 + 2단 명암(셀 셰이딩). 만화 영화 느낌.',['굵은 선','2단 명암','친근함'],{shade:(c,p,col,b)=>{c.fillStyle=col;c.fill(p);clipDo(c,p,()=>{c.fillStyle=mul(col,.72);c.fillRect(b.x+b.w*.58,b.y-20,b.w+40,b.h+40)});c.lineWidth=3;c.strokeStyle='#141414';c.lineJoin='round';c.stroke(p)},bg:(c)=>{const g2=c.createLinearGradient(0,0,0,CH);g2.addColorStop(0,'#9fd3f0');g2.addColorStop(1,'#e8f4fa');c.fillStyle=g2;c.fillRect(0,0,CW,CH);c.fillStyle='#7aaa5a';c.fillRect(0,BASEY,CW,CH);c.fillStyle='#141414';c.fillRect(0,BASEY,CW,3)}}],
 ['치비 카툰','머리가 큰 2등신 귀여운 비율. 무서움보다 귀여움.',['2등신','귀여움','큰 머리'],{prop:'chibi',round:8,shade:(c,p,col,b)=>{c.fillStyle=col;c.fill(p);clipDo(c,p,()=>{c.fillStyle=mul(col,.8);c.fillRect(b.x+b.w*.6,b.y-20,b.w+40,b.h+40);c.fillStyle='#ffffff40';c.fillRect(b.x+b.w*.15,b.y+b.h*.12,b.w*.2,b.h*.15)});c.lineWidth=3.5;c.strokeStyle='#3a2a2a';c.lineJoin='round';c.stroke(p)},eye:(c,x,y,r,col,zb)=>{c.fillStyle='#fff';c.beginPath();c.arc(x,y,r*1.5,0,6.3);c.fill();c.fillStyle=zb?col:'#222';c.beginPath();c.arc(x+r*.3,y,r,0,6.3);c.fill();c.fillStyle='#fff';c.fillRect(x+r*.4,y-r*.6,r*.5,r*.5)},bg:(c)=>{c.fillStyle='#ffeaf0';c.fillRect(0,0,CW,CH);c.fillStyle='#f6c8d6';c.fillRect(0,BASEY,CW,CH)}}],
 ['애니메이션 셀','얇은 선 + 선명한 그림자 경계. 일본 애니메이션 느낌.',['얇은 선','애니','선명한 그림자'],{shade:(c,p,col,b)=>{c.fillStyle=col;c.fill(p);clipDo(c,p,()=>{c.fillStyle=mul(sat(col,1.15),.74);c.beginPath();c.moveTo(b.x+b.w*.45,b.y-30);c.lineTo(b.x+b.w+30,b.y-30);c.lineTo(b.x+b.w+30,b.y+b.h+30);c.lineTo(b.x+b.w*.65,b.y+b.h+30);c.fill()});c.lineWidth=1.4;c.strokeStyle=mul(col,.35);c.stroke(p)},eye:(c,x,y,r,col,zb)=>{c.fillStyle=zb?col:'#2a1a3a';c.beginPath();c.ellipse(x,y,r*.9,r*1.5,0,0,6.3);c.fill();c.fillStyle='#fff';c.fillRect(x-r*.2,y-r*1.1,r*.6,r*.6)},bg:(c)=>{const g2=c.createLinearGradient(0,0,0,CH);g2.addColorStop(0,'#c8e0ff');g2.addColorStop(1,'#fff6ea');c.fillStyle=g2;c.fillRect(0,0,CW,CH);c.fillStyle='#d8c8b0';c.fillRect(0,BASEY,CW,CH)}}],
 ['그래픽 노블 잉크','흑백 잉크와 빗금으로 명암을 표현하는 그래픽 노블.',['흑백','빗금','진지함'],{shade:(c,p,col,b)=>{const l=lumH(col);if(l<.32){c.fillStyle='#111';c.fill(p)}else{c.fillStyle='#f4f0e6';c.fill(p);clipDo(c,p,()=>{c.strokeStyle='#111';c.lineWidth=1;const sp=2.5+l*7;for(let i=-60;i<b.w+b.h+60;i+=sp){c.beginPath();c.moveTo(b.x+i,b.y-10);c.lineTo(b.x+i-b.h-20,b.y+b.h+10);c.stroke()}c.fillStyle='#f4f0e6';c.fillRect(b.x,b.y-5,b.w*.45,b.h+10)})}c.lineWidth=2;c.strokeStyle='#111';c.stroke(p)},eye:(c,x,y,r,col,zb)=>{c.fillStyle=zb?'#c41414':'#111';c.beginPath();c.arc(x,y,r,0,6.3);c.fill()},detail:(c,col,rs)=>{c.fillStyle=col.startsWith('#9a')?'#c41414':'#111';rs.forEach(([x,y,w,h])=>c.fillRect(x,y,w,h))},bg:(c)=>{c.fillStyle='#f4f0e6';c.fillRect(0,0,CW,CH);c.strokeStyle='#111';c.lineWidth=1;for(let x=-CH;x<CW;x+=5){c.beginPath();c.moveTo(x,CH);c.lineTo(x+CH-BASEY,BASEY);c.stroke()}c.lineWidth=2;c.beginPath();c.moveTo(0,BASEY);c.lineTo(CW,BASEY);c.stroke()}}],
 ['연필 스케치','손으로 그린 듯 흔들리는 연필 선과 옅은 채색.',['손그림','연필','따뜻함'],{shade:(c,p,col)=>{c.globalAlpha=.25;c.fillStyle=col;c.fill(p);c.globalAlpha=1;c.strokeStyle='#2a2a2a';c.lineWidth=.9;for(let k=0;k<3;k++){c.save();c.translate((rnd()-.5)*2.4,(rnd()-.5)*2.4);c.stroke(p);c.restore()}},bg:(c)=>{c.fillStyle='#f6f1e4';c.fillRect(0,0,CW,CH);c.strokeStyle='#c8d4e0';c.lineWidth=1;for(let y=14;y<CH;y+=16){c.beginPath();c.moveTo(0,y);c.lineTo(CW,y);c.stroke()}c.strokeStyle='#555';for(let k=0;k<3;k++){c.beginPath();c.moveTo(0,BASEY+(rnd()-.5)*2);c.lineTo(CW,BASEY+(rnd()-.5)*2);c.stroke()}}}],
 ['수채화','번지는 물감과 겹쳐진 색. 동화책 같은 부드러운 분위기.',['수채','번짐','동화책'],{shade:(c,p,col)=>{for(let k=0;k<3;k++){c.save();c.translate((rnd()-.5)*4,(rnd()-.5)*4);c.globalAlpha=.32;c.fillStyle=k==2?mul(col,1.15):col;c.fill(p);c.restore()}c.globalAlpha=.35;c.strokeStyle=mul(col,.6);c.lineWidth=1.6;c.stroke(p);c.globalAlpha=1},bg:(c)=>{c.fillStyle='#fbf7ef';c.fillRect(0,0,CW,CH);for(let i=0;i<14;i++){c.globalAlpha=.12;c.fillStyle=['#9ac0d8','#c8d8a0','#e8c8a0'][i%3];c.beginPath();c.arc(rnd()*CW,rnd()*BASEY,30+rnd()*50,0,6.3);c.fill()}c.globalAlpha=.25;c.fillStyle='#a8b890';c.fillRect(0,BASEY-4,CW,CH);c.globalAlpha=1}}],
